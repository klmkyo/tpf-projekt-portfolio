  <text class="box-text" text-anchor="middle" x="1460" y="397">odnośniki</text>

  <path class="arrow" d="M365 207 H493"/>
  <path class="arrow" d="M775 207 H903"/>
  <path class="arrow" d="M1185 207 H1313"/>
  <path class="arrow" d="M230 260 V313"/>
  <path class="arrow" d="M1460 260 V313"/>

