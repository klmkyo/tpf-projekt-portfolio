<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1720" viewBox="0 0 1800 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .label { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .small-label { font: 700 24px Arial, Helvetica, sans-serif; fill: #374151; }
      .box-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-text { font: 400 24px Arial, Helvetica, sans-serif; fill: #374151; }
      .public { fill: #fff7f7; stroke: #ef4444; }
      .neutral { fill: #f9fafb; stroke: #6b7280; }
      .admin { fill: #f3f7ff; stroke: #2563eb; }
      .group { fill: #ffffff; stroke: #d1d5db; }
      .arrow { stroke: #4b5563; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .sync { stroke: #2563eb; stroke-width: 3; fill: none; stroke-dasharray: 12 10; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1800" height="860" fill="#ffffff"/>

  <rect class="group" x="45" y="55" width="1710" height="405"/>
