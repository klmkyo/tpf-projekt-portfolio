    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .section-title-red { font: 700 30px Arial, Helvetica, sans-serif; fill: #b91c1c; }
      .section-title-orange { font: 700 30px Arial, Helvetica, sans-serif; fill: #b45309; }
      .actor-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .actor-note { font: 400 22px Arial, Helvetica, sans-serif; fill: #374151; }
